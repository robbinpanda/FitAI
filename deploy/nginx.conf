# Install into /etc/nginx/sites-available/fitai (included from nginx http context).
# Replace every fitai.example.com with your actual domain; obtain TLS first.
limit_req_zone $binary_remote_addr zone=fitai_requests:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=fitai_auth:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=fitai_connections:1m;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name fitai.example.com;
    return 301 https://fitai.example.com$request_uri;
}
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
}
server {
    listen 443 ssl;
    server_name fitai.example.com;
    ssl_certificate /etc/letsencrypt/live/fitai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitai.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 8m;
    client_body_buffer_size 128k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn fitai_connections 8;
    limit_req zone=fitai_requests burst=20 nodelay;
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=fitai_auth burst=3 nodelay;
        include /etc/nginx/snippets/fitai-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/fitai-proxy.conf;
    }
}
